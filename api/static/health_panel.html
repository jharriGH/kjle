<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KJLE System Health</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3340;
    --tx:#e6edf3; --tx2:#9aa7b4; --tx3:#6b7684;
    --green:#2ea043; --green-bg:#0f2a16;
    --yellow:#d29922; --yellow-bg:#2a2410;
    --red:#f85149; --red-bg:#2a1113;
    --accent:#58a6ff; --radius:14px; --gap:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 16px 60px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:22px}
  h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
  .crown{font-size:22px}
  .meta{color:var(--tx3);font-size:12.5px;margin-left:auto;text-align:right;line-height:1.5}
  .meta b{color:var(--tx2);font-weight:600}
  .banner{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:var(--radius);border:1px solid var(--line);margin-bottom:24px;background:var(--panel)}
  .banner .dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.04)}
  .banner .headline{font-size:17px;font-weight:650}
  .banner .sub{color:var(--tx2);font-size:13px;margin-top:3px}
  .banner.green{background:linear-gradient(180deg,var(--green-bg),var(--panel))}
  .banner.green .dot{background:var(--green)}
  .banner.yellow{background:linear-gradient(180deg,var(--yellow-bg),var(--panel))}
  .banner.yellow .dot{background:var(--yellow)}
  .banner.red{background:linear-gradient(180deg,var(--red-bg),var(--panel))}
  .banner.red .dot{background:var(--red);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .seclabel{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:26px 2px 12px}
  .stages{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .tile .k{font-size:12px;color:var(--tx3);font-weight:600;display:flex;align-items:center;gap:7px}
  .tile .v{font-size:19px;font-weight:700;margin-top:7px;letter-spacing:-.01em}
  .tile .s{font-size:11.5px;color:var(--tx2);margin-top:3px}
  .pip{width:9px;height:9px;border-radius:50%;flex:none}
  .pip.green{background:var(--green)} .pip.yellow{background:var(--yellow)} .pip.red{background:var(--red)} .pip.unknown{background:var(--tx3)}
  .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-top:var(--gap)}
  .num{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .num .k{font-size:11.5px;color:var(--tx3);font-weight:600}
  .num .v{font-size:21px;font-weight:750;margin-top:5px;font-variant-numeric:tabular-nums}
  .jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .job{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .job .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .job.green .dot{background:var(--green)} .job.yellow .dot{background:var(--yellow)} .job.red .dot{background:var(--red)} .job.unknown .dot{background:var(--tx3)}
  .job.red{border-color:#5b2327} .job .body{min-width:0;flex:1}
  .job .name{font-size:13.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .job .det{font-size:11.5px;color:var(--tx3);margin-top:2px}
  .job .badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;flex:none}
  .job.green .badge{background:var(--green-bg);color:#5fd27a}
  .job.yellow .badge{background:var(--yellow-bg);color:#e3b341}
  .job.red .badge{background:var(--red-bg);color:#ff7b72}
  .job.unknown .badge{background:#1c2330;color:var(--tx3)}
  footer{margin-top:30px;color:var(--tx3);font-size:12px;text-align:center}
  .err{background:var(--red-bg);border:1px solid #5b2327;color:#ff9b95;padding:16px;border-radius:12px}
  button.refresh{background:var(--panel2);color:var(--tx2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  button.refresh:hover{color:var(--tx);border-color:#3a4553}
  @media(max-width:720px){.stages,.nums{grid-template-columns:repeat(2,1fr)}.jobs{grid-template-columns:1fr}.meta{margin-left:0;text-align:left;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="crown">&#128081;</span><h1>KJLE System Health</h1><div class="meta" id="meta">loading&#8230;</div></header>
  <div id="root"><div class="banner"><div class="dot" style="background:var(--tx3)"></div><div><div class="headline">Checking the engine&#8230;</div><div class="sub">Fetching live status</div></div></div></div>
  <footer>Auto-refreshes every 60s &#183; <button class="refresh" onclick="load()">Refresh now</button><br><span id="src"></span></footer>
</div>
<script>
const API="/kjle/v1/health/overview";
const TZ="America/Los_Angeles";
function ago(iso){if(!iso)return"never";const d=new Date(iso),s=(Date.now()-d.getTime())/1000;if(s<90)return Math.round(s)+"s ago";if(s<5400)return Math.round(s/60)+"m ago";if(s<172800)return Math.round(s/3600)+"h ago";return Math.round(s/86400)+"d ago";}
function clock(iso){if(!iso)return"—";try{return new Date(iso).toLocaleString("en-US",{timeZone:TZ,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}catch(e){return iso;}}
function n(x){return(x==null)?"—":Number(x).toLocaleString("en-US");}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
async function load(){const meta=document.getElementById("meta"),root=document.getElementById("root");try{const r=await fetch(API,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();render(d);meta.innerHTML="Last checked <b>"+new Date().toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"})+"</b>";document.getElementById("src").textContent="source: kjle-api /health/overview";}catch(e){root.innerHTML='<div class="err"><b>Couldn\'t reach the health endpoint.</b><br>'+esc(e.message)+' — the API may be redeploying. This panel retries automatically.</div>';meta.innerHTML="<b style='color:#ff7b72'>unreachable</b>";}}
function render(d){const overall=(d.overall||"red").toLowerCase();const jobs=d.jobs||d.items||[];const st=d.stages||{};const reds=(d.red_count!=null)?d.red_count:jobs.filter(j=>j.color==="red").length;const yel=(d.yellow_count!=null)?d.yellow_count:jobs.filter(j=>j.color==="yellow").length;const head=overall==="green"?"All systems green":overall==="yellow"?(yel+" item"+(yel==1?"":"s")+" need attention"):(reds+" issue"+(reds==1?"":"s")+" detected — action needed");const sub=overall==="green"?"Every cron ran on time and every stage is fresh.":"Scroll down for the red/yellow items.";const stageDefs=[["Ingest","last_ingest_at"],["Email clean","last_email_clean_at"],["Enrichment","last_enriched_at"],["Classify","last_classified_at"]];const sc=st.stage_colors||{};let stagesHtml=stageDefs.map(function(p){var label=p[0],k=p[1];var iso=st[k];var col=sc[k]||"green";return '<div class="tile"><div class="k"><span class="pip '+col+'"></span>'+label+'</div><div class="v">'+ago(iso)+'</div><div class="s">'+clock(iso)+'</div></div>';}).join("");var numsHtml=[["Send-ready","send_ready"],["Unenriched","backlog_unenriched"],["Uncleaned","backlog_uncleaned"],["In TrueList batch","pending_batch"]].map(function(p){return '<div class="num"><div class="k">'+p[0]+'</div><div class="v">'+n(st[p[1]])+'</div></div>';}).join("");var jobsHtml=jobs.map(function(j){var c=(j.color||"green").toLowerCase();var label=esc(j.label||j.name);var det=(j.last_status?("ran "+esc(j.last_status)):"")+(j.last_ran?(" · "+ago(j.last_ran)):"")+(j.detail?(" · "+esc(j.detail)):"");return '<div class="job '+c+'"><span class="dot"></span><div class="body"><div class="name">'+label+'</div><div class="det">'+(det||"—")+'</div></div><span class="badge">'+c+'</span></div>';}).join("");document.getElementById("root").innerHTML='<div class="banner '+overall+'"><div class="dot"></div><div><div class="headline">'+head+'</div><div class="sub">'+sub+'</div></div></div><div class="seclabel">Pipeline stages — last activity</div><div class="stages">'+stagesHtml+'</div><div class="nums">'+numsHtml+'</div><div class="seclabel">Scheduled jobs — did they run?</div><div class="jobs">'+jobsHtml+'</div>';}
load();setInterval(load,60000);
</script>
</body>
</html>
